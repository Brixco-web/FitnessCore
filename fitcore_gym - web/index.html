<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="FitCore Gym — Campus Fitness Attendance & Member Management" />
    <title>FitCore Gym</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#dae2fd", "tertiary-fixed": "#ffdcc3",
              "on-secondary": "#ffffff", "secondary-container": "#7cf994",
              "on-surface-variant": "#584237", "surface-container-lowest": "#ffffff",
              "on-error-container": "#93000a", "outline": "#8c7164",
              "on-tertiary-container": "#502800", "surface-container-low": "#f2f3ff",
              "secondary-fixed": "#7ffc97", "primary-fixed": "#ffdbca",
              "on-tertiary-fixed-variant": "#6e3900", "on-primary-fixed-variant": "#783200",
              "secondary-fixed-dim": "#62df7d", "primary-fixed-dim": "#ffb690",
              "primary-container": "#f97316", "surface-container": "#eaedff",
              "surface-container-high": "#e2e7ff", "on-error": "#ffffff",
              "outline-variant": "#e0c0b1", "secondary": "#006e2d",
              "on-tertiary-fixed": "#2f1500", "on-tertiary": "#ffffff",
              "on-secondary-fixed-variant": "#005320", "surface-dim": "#d2d9f4",
              "error": "#ba1a1a", "inverse-surface": "#283044",
              "on-primary": "#ffffff", "inverse-primary": "#ffb690",
              "on-primary-container": "#582200", "surface-tint": "#9d4300",
              "on-surface": "#131b2e", "surface-bright": "#faf8ff",
              "error-container": "#ffdad6", "tertiary-container": "#e68117",
              "background": "#faf8ff", "inverse-on-surface": "#eef0ff",
              "on-primary-fixed": "#341100", "tertiary": "#904d00",
              "surface": "#faf8ff", "surface-container-highest": "#dae2fd",
              "on-secondary-fixed": "#002109", "on-secondary-container": "#007230",
              "tertiary-fixed-dim": "#ffb77d", "on-background": "#131b2e",
              "primary": "#9d4300"
            },
            borderRadius: {
              DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"
            },
            spacing: {
              "space-2xl": "2rem", "margin": "1rem", "margin-tablet": "1.5rem",
              "space-2xs": "0.25rem", "space-xs": "0.375rem", "gutter-sm": "0.75rem",
              "space-sm": "0.5rem", "space-lg": "1.25rem", "space-md": "0.75rem",
              "space-base": "1rem", "gutter": "1rem", "space-xl": "1.5rem"
            },
            fontFamily: {
              "body-md": ["Plus Jakarta Sans"], "data-metric": ["Space Grotesk"],
              "data-tabular": ["JetBrains Mono"], "headline-sm": ["Space Grotesk"],
              "body-sm": ["Plus Jakarta Sans"], "headline-lg": ["Space Grotesk"],
              "headline-xl-mobile": ["Space Grotesk"], "label-caps": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"], "headline-xl": ["Space Grotesk"]
            },
            fontSize: {
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "data-metric": ["32px", { lineHeight: "36px", letterSpacing: "-0.03em", fontWeight: "700" }],
              "data-tabular": ["14px", { lineHeight: "20px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "headline-sm": ["18px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "600" }],
              "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
              "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "headline-xl-mobile": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "label-caps": ["11px", { lineHeight: "14px", letterSpacing: "0.06em", fontWeight: "700" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "500" }],
              "headline-xl": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }]
            }
          }
        }
      }
    </script>

    <style>
      @layer base {
        html, body { width: 100vw; margin: 0; padding: 0; }
        body { overscroll-behavior: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        main > :first-child { margin-top: 0 !important; }
        main > :last-child { margin-bottom: 0 !important; }
      }
      ::-webkit-scrollbar { display: none; }
      body { min-height: max(884px, 100dvh); }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
